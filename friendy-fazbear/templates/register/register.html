{% extends 'base.html' %}
{% block title %}Create Account | Friendy Fazbear{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">🕹️</div>
            <h2>Join the Arcade</h2>
            <p class="auth-subtitle">Create your Fazbear player profile</p>
        </div>

        {% for message in messages %}
            <div class="auth-error">⚠️ {{ message }}</div>
        {% endfor %}

        <form method="POST">
            {% csrf_token %}
            <label>Username</label>
            <input type="text" name="username" placeholder="Choose a gamer username" required autofocus>

            <label>Email</label>
            <input type="email" name="email" placeholder="you@example.com" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Create a password" required>

            <button type="submit" class="btn" style="width: 100%; margin-top: 1.25rem;">
                Create Account
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{% url 'login' %}">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
