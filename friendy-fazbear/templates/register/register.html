{% extends 'base.html' %}
{% block title %}Create Account | Friendy Fazbear{% endblock %}
{% block content %}
<div style="max-width: 420px; margin: 4rem auto;">
    <div class="card">
        <h2 style="margin-bottom: 0.4rem;">Join the Arcade</h2>
        <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Create your Fazbear player profile</p>
        {% for message in messages %}
            <p style="color: #f87171; margin-bottom: 1rem; font-size: 0.9rem;">{{ message }}</p>
        {% endfor %}
        <form method="POST">
            {% csrf_token %}
            <label>Username</label>
            <input type="text" name="username" placeholder="Choose a gamer username" required>
            <label>Email</label>
            <input type="email" name="email" placeholder="you@example.com" required>
            <label>Password</label>
            <input type="password" name="password" placeholder="Create a password" required>
            <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">Create Account</button>
        </form>
        <p style="text-align: center; color: var(--muted); font-size: 0.88rem; margin-top: 1.25rem;">
            Already have an account? <a href="{% url 'login' %}" style="color: var(--accent); text-decoration: none;">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
