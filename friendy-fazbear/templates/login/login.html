{% extends 'base.html' %}
{% block title %}Sign In | Friendy Fazbear{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">🎮</div>
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Sign in to your Fazbear arcade account</p>
        </div>

        {% for message in messages %}
            <div class="auth-error">⚠️ {{ message }}</div>
        {% endfor %}

        <form method="POST">
            {% csrf_token %}
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter your username" required autofocus>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>

            <button type="submit" class="btn" style="width: 100%; margin-top: 1.25rem;">
                Sign In
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{% url 'register' %}">Create one</a>
        </div>
    </div>
</div>
{% endblock %}
