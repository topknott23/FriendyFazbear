{% extends 'base.html' %}
{% block title %}Sign In | Friendy Fazbear{% endblock %}
{% block content %}
<div style="max-width: 420px; margin: 4rem auto;">
    <div class="card">
        <h2 style="margin-bottom: 0.4rem;">Welcome back</h2>
        <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Enter your credentials to access your account</p>
        {% for message in messages %}
            <p style="color: #f87171; margin-bottom: 1rem; font-size: 0.9rem;">{{ message }}</p>
        {% endfor %}
        <form method="POST">
            {% csrf_token %}
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter your username" required>
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>
            <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">Sign In</button>
        </form>
        <p style="text-align: center; color: var(--muted); font-size: 0.88rem; margin-top: 1.25rem;">
            Don't have an account? <a href="{% url 'register' %}" style="color: var(--accent); text-decoration: none;">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
